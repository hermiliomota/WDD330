
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2 id="category-title">Top Products</h2>

        <div class="product-sort">
          <label for="sort-products">Sort products by:</label>

          <select id="sort-products">
            <option value="default">Default Order</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>

        <ul class="product-list"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="/js/product-listing.js"></script>
  </body>
</html>
